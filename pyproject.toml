[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mkdocs-review-comments"
version = "0.2.0"
description = "Review comments that live in the markdown as tagged HTML comments: threads, replies, resolution, a review build that renders them, and a page-side comment box that writes them back."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Intecre" }]
dependencies = [
    "mkdocs>=1.5",
    "markdown>=3.4",
]

[project.urls]
Homepage = "https://github.com/mark-lazarides/mkdocs-review-comments"
Repository = "https://github.com/mark-lazarides/mkdocs-review-comments"
Issues = "https://github.com/mark-lazarides/mkdocs-review-comments/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mkrc = "mkdocs_review_comments.cli:main"

[project.entry-points."mkdocs.plugins"]
review-comments = "mkdocs_review_comments.plugin:ReviewCommentsPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mkdocs_review_comments = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
